name: Update README

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".github/readme/assets/**"
      - ".github/readme/MANUAL.md"
      - "output/**"
  schedule:
    # 18:45 UTC = 00:15 Asia/Kolkata (next day)
    - cron: "45 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-updater
  cancel-in-progress: true

jobs:
  update-readme:
    name: Rebuild dashboard, heatmap & README
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README and assets
        run: python .github/readme/scripts/update_readme.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md .github/readme/assets/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "docs: auto-update README and dashboard [skip ci]"
          git push
